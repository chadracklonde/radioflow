name: Build des plateformes

# Lancement manuel (Actions > Build des plateformes > Run workflow).
# Ces compilations n'ont pas encore été exécutées : les premiers essais peuvent demander
# des ajustements (signature, versions des outils Android / Xcode...).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à compiler (les builds macOS et iOS consomment 10x plus de minutes)"
        type: choice
        options: [android, windows, macos, ios, toutes]
        default: android

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'toutes' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: radio-flow-android-debug
          path: radio_flow/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'toutes' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: radio-flow-windows
          path: radio_flow/build/windows/x64/runner/Release

  macos:
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'toutes' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'toutes' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
