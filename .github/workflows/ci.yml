name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # Les tests utilisent SQLite (file d'envoi hors ligne).
      - name: Bibliothèque SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter --version
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      - name: Tests
        run: flutter test
      # La version web doit rester compilable (pas de SQLite ni de fichiers locaux).
      - name: Compilation web
        run: flutter build web --release

  android:
    name: Android (compilation version de production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio_flow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      # Signée avec la clé de debug : suffisante pour tester, pas pour publier sur le Play Store.
      - name: Compilation (release)
        run: flutter build apk --release

      # Une version de production sans cette permission ne peut joindre aucun serveur.
      - name: Vérifier les permissions de l'APK de production
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          grep -q "android.permission.INTERNET" permissions.txt \
            || { echo "ECHEC : permission INTERNET absente de l'APK de production."; exit 1; }
          "$AAPT2" dump badging "$APK" | grep -E "^(package|application-label):"

      - uses: actions/upload-artifact@v4
        with:
          name: radio-flow-android-release
          path: radio_flow/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  database:
    name: Base de données (migrations + sécurité)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations dans l'ordre puis tests de sécurité
        run: bash supabase/tests/run.sh

  edge-function:
    name: Fonction serveur (types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/manage-team/index.ts supabase/functions/send-push/index.ts

  secrets:
    name: Aucun secret versionné
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh
